<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиццерия МамаМия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        .nav-tabs { display: flex; gap: 10px; }
        .nav-tab { padding: 6px 14px; border: 1px solid #999; border-radius: 4px; background: #fff; cursor: pointer; }
        .nav-tab.active { background: #333; color: #fff; }
        .nav-tab.admin-only { display: none; }
        .nav-tab.admin-only.visible { display: inline-block; }
        .auth-btn { padding: 6px 14px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .user-info .role { background: #c00; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; }
        .logout-btn { padding: 4px 10px; border: 1px solid #999; background: #fff; cursor: pointer; border-radius: 3px; }
        
        .content-section { display: none; }
        .content-section.active { display: block; }
        
        .pizza-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
        .pizza-card { border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
        .pizza-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; }
        .pizza-card .emoji { font-size: 2.5rem; text-align: center; margin-bottom: 8px; }
        .pizza-card h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .pizza-card .desc { font-size: 0.85rem; color: #555; margin-bottom: 8px; }
        .pizza-card .meta { font-size: 0.8rem; color: #777; margin-bottom: 8px; }
        .pizza-card .bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .pizza-card .price { font-weight: bold; font-size: 1.1rem; }
        .pizza-card .actions { display: none; gap: 6px; }
        .pizza-card.admin-mode .actions { display: flex; }
        .pizza-card .actions button { padding: 4px 8px; border: 1px solid #999; border-radius: 3px; background: #fff; cursor: pointer; font-size: 0.8rem; }
        .cart-btn { padding: 6px 12px; background: #28a745; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 0.85rem; }
        .cart-btn:hover { background: #218838; }
        
        .form-container { max-width: 500px; margin-top: 16px; }
        .form-container h2 { margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.9rem; margin-bottom: 4px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
        .form-group textarea { min-height: 60px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .submit-btn { width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 8px; }
        .cancel-btn { background: #666; margin-top: 8px; }
        .form-message { margin-top: 10px; padding: 8px; border-radius: 4px; text-align: center; display: none; font-size: 0.9rem; }
        .form-message.success { background: #d4edda; color: #155724; }
        .form-message.error { background: #f8d7da; color: #721c24; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal.active { display: flex; }
        .modal-card { background: #fff; border-radius: 8px; padding: 24px; width: 350px; position: relative; }
        .modal-close { position: absolute; top: 10px; right: 14px; font-size: 1.4rem; cursor: pointer; color: #666; }
        .modal h2 { margin-bottom: 6px; }
        .modal p { color: #666; margin-bottom: 14px; font-size: 0.9rem; }
        .modal .input-group { margin-bottom: 12px; }
        .modal .input-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; }
        .modal input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .modal button[type="submit"] { width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 6px; }
        .modal .toggle { text-align: center; margin-top: 12px; font-size: 0.85rem; }
        .modal .toggle a { color: #0066cc; cursor: pointer; }
        .modal .message { margin-top: 10px; padding: 6px; border-radius: 4px; font-size: 0.8rem; text-align: center; display: none; }
        .modal .message.success { background: #d4edda; color: #155724; }
        .modal .message.error { background: #f8d7da; color: #721c24; }
        
        .cart-modal .quantity-control { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
        .cart-modal .quantity-btn { width: 36px; height: 36px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font-size: 1.2rem; }
        .cart-modal .quantity-btn:hover { background: #f0f0f0; }
        .cart-modal .quantity-display { font-size: 1.5rem; font-weight: bold; min-width: 40px; text-align: center; }
        .cart-modal .pizza-info { background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
        .cart-modal .pizza-info h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .cart-modal .pizza-info .price { color: #28a745; font-weight: bold; }
        
        .loading { text-align: center; padding: 20px; color: #666; }
        .notification { position: fixed; top: 20px; right: 20px; background: #28a745; color: #fff; padding: 12px 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 1000; display: none; }
        .notification.error { background: #dc3545; }
    </style>
</head>
<body>

<header>
    <h2>🍕 МамаМия</h2>
    <nav class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('catalog')">Каталог</button>
        <button class="nav-tab admin-only" id="adminTab" onclick="switchTab('addPizza')">Добавить пиццу</button>
    </nav>
    <div id="headerAuthArea">
        <button class="auth-btn" onclick="openModal()">Войти</button>
    </div>
</header>

<main>
    <section id="catalog-section" class="content-section active">
        <h2>Каталог пицц</h2>
        <div id="pizzaLoading" class="loading">Загрузка...</div>
        <div class="pizza-grid" id="pizzaCatalog"></div>
    </section>

    <section id="add-pizza-section" class="content-section">
        <div class="form-container">
            <h2 id="formTitle">Добавить пиццу</h2>
            <form id="pizzaForm">
                <input type="hidden" id="pizzaId">
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" id="namePizza" required placeholder="Маргарита">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Цена (руб) *</label>
                        <input type="number" id="cost" required min="0" placeholder="450">
                    </div>
                    <div class="form-group">
                        <label>Размер (см) *</label>
                        <select id="size" required>
                            <option value="25">25</option>
                            <option value="30" selected>30</option>
                            <option value="35">35</option>
                            <option value="40">40</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ингредиенты *</label>
                    <textarea id="ingredients" required placeholder="Томатный соус, моцарелла, базилик"></textarea>
                </div>
                <div class="form-group">
                    <label>URL картинки</label>
                    <input type="url" id="picturePizza" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Тесто *</label>
                    <select id="thicknessDough" required>
                        <option value="true">Тонкое</option>
                        <option value="false">Толстое</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" id="pizzaBtn">Добавить</button>
                <button type="button" class="submit-btn cancel-btn" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">Отмена</button>
                <div id="pizzaMessage" class="form-message"></div>
            </form>
        </div>
    </section>
</main>

<!-- Модальное окно авторизации -->
<div id="authModal" class="modal">
    <div class="modal-card">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle">Вход</h2>
        <p id="modalSub">Войдите в аккаунт</p>
        <form id="authForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="password" required placeholder="••••••">
            </div>
            <button type="submit" id="authBtn">Войти</button>
        </form>
        <div id="modalMessage" class="message"></div>
        <div class="toggle">
            <span id="toggleText">Нет аккаунта?</span>
            <a id="toggleLink" onclick="toggleMode()">Зарегистрироваться</a>
        </div>
    </div>
</div>

<!-- Модальное окно корзины -->
<div id="cartModal" class="modal cart-modal">
    <div class="modal-card">
        <span class="modal-close" onclick="closeCartModal()">&times;</span>
        <h2>Добавить в корзину</h2>
        <div class="pizza-info">
            <h3 id="cartPizzaName"></h3>
            <div class="price" id="cartPizzaPrice"></div>
        </div>
        <label>Количество:</label>
        <div class="quantity-control">
            <button class="quantity-btn" onclick="changeQuantity(-1)">−</button>
            <div class="quantity-display" id="quantityDisplay">1</div>
            <button class="quantity-btn" onclick="changeQuantity(1)">+</button>
        </div>
        <button type="button" class="submit-btn" onclick="confirmAddToCart()" style="background: #28a745;">Добавить в корзину</button>
        <div id="cartMessage" class="form-message"></div>
    </div>
</div>

<div id="notification" class="notification"></div>

<script>
    const API_URL = 'http://localhost:8000';
    let currentUser = { id: null, email: '', role: '', isLoggedIn: false };
    let isLoginMode = true;
    let allPizzas = [];
    let isEditMode = false;
    let currentCartPizza = null;
    let cartQuantity = 1;

    function switchTab(tab) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        if (tab === 'catalog') {
            document.querySelector('.nav-tab:first-child').classList.add('active');
            document.getElementById('catalog-section').classList.add('active');
            loadPizzas();
        } else {
            document.getElementById('adminTab').classList.add('active');
            document.getElementById('add-pizza-section').classList.add('active');
        }
    }

    async function loadPizzas() {
        const loading = document.getElementById('pizzaLoading');
        const grid = document.getElementById('pizzaCatalog');
        try {
            loading.style.display = 'block';
            grid.innerHTML = '';
            const response = await fetch(`${API_URL}/pizzas`, { headers: { 'Accept': 'application/json' } });
            if (response.ok) {
                allPizzas = await response.json();
                renderCatalog();
            } else {
                grid.innerHTML = '<p>Ошибка загрузки</p>';
            }
        } catch (error) {
            grid.innerHTML = '<p>Ошибка соединения с сервером</p>';
        } finally {
            loading.style.display = 'none';
        }
    }

    function renderCatalog() {
        const grid = document.getElementById('pizzaCatalog');
        const isAdmin = currentUser.role === 'admin';
        if (allPizzas.length === 0) {
            grid.innerHTML = '<p>Пицц пока нет</p>';
            return;
        }
        grid.innerHTML = allPizzas.map(pizza => {
            const hasImage = pizza.picturePizza && pizza.picturePizza.trim() !== '';
            return `
                <div class="pizza-card ${isAdmin ? 'admin-mode' : ''}">
                    ${hasImage
                        ? `<img src="${pizza.picturePizza}" alt="${pizza.namePizza}" onerror="this.outerHTML='<div class=\\'emoji\\'>🍕</div>'">`
                        : `<div class="emoji">🍕</div>`
                    }
                    <h3>${pizza.namePizza}</h3>
                    <div class="desc">${pizza.ingredients}</div>
                    <div class="meta">${pizza.size} см • ${pizza.thicknessDough ? 'Тонкое' : 'Толстое'} тесто</div>
                    <div class="bottom">
                        <span class="price">${pizza.cost} ₽</span>
                        <div class="actions">
                            <button onclick="editPizza(${pizza.id})">✏️</button>
                            <button onclick="deletePizza(${pizza.id})">🗑️</button>
                        </div>
                        <button class="cart-btn" onclick="openCartModal(${pizza.id})">В корзину</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function editPizza(id) {
        const pizza = allPizzas.find(p => p.id === id);
        if (!pizza) return;
        document.getElementById('pizzaId').value = pizza.id;
        document.getElementById('namePizza').value = pizza.namePizza || '';
        document.getElementById('cost').value = pizza.cost || 0;
        document.getElementById('ingredients').value = pizza.ingredients || '';
        document.getElementById('picturePizza').value = pizza.picturePizza || '';
        document.getElementById('size').value = pizza.size || 30;
        document.getElementById('thicknessDough').value = pizza.thicknessDough ? 'true' : 'false';
        isEditMode = true;
        document.getElementById('formTitle').textContent = 'Редактировать пиццу';
        document.getElementById('pizzaBtn').textContent = 'Сохранить';
        document.getElementById('cancelEditBtn').style.display = 'block';
        switchTab('addPizza');
    }

    async function deletePizza(id) {
        if (!confirm('Удалить пиццу?')) return;
        try {
            const response = await fetch(`${API_URL}/pizzas/delete/${id}`, { method: 'DELETE', credentials: 'include' });
            if (response.ok) {
                await loadPizzas();
            } else {
                alert('Ошибка удаления');
            }
        } catch (error) {
            alert('Ошибка соединения');
        }
    }

    function cancelEdit() {
        isEditMode = false;
        document.getElementById('pizzaForm').reset();
        document.getElementById('pizzaId').value = '';
        document.getElementById('formTitle').textContent = 'Добавить пиццу';
        document.getElementById('pizzaBtn').textContent = 'Добавить';
        document.getElementById('cancelEditBtn').style.display = 'none';
        document.getElementById('pizzaMessage').style.display = 'none';
    }

    async function checkAuth() {
        try {
            const response = await fetch(`${API_URL}/auth/me`, { credentials: 'include', headers: { 'Accept': 'application/json' } });
            if (response.ok) {
                const data = await response.json();
                console.log('🔍 Данные пользователя:', data);
                
                // Пробуем разные варианты полей для ID
                const userId = data.id || data.user_id || data.sub || null;
                
                currentUser = { 
                    id: userId,
                    email: data.email || data.sub || '', 
                    role: data.role || 'user', 
                    isLoggedIn: true 
                };
                
                console.log('✅ Текущий пользователь:', JSON.stringify(currentUser, null, 2));
            } else {
                currentUser = { id: null, email: '', role: '', isLoggedIn: false };
            }
        } catch (error) {
            console.error('❌ Ошибка проверки авторизации:', error);
            currentUser = { id: null, email: '', role: '', isLoggedIn: false };
        }
        updateHeader();
    }

    function updateHeader() {
        const authArea = document.getElementById('headerAuthArea');
        const adminTab = document.getElementById('adminTab');
        if (currentUser.isLoggedIn) {
            const emailShort = currentUser.email.split('@')[0];
            const roleBadge = currentUser.role === 'admin' ? '<span class="role">ADMIN</span>' : '';
            authArea.innerHTML = `
                <div class="user-info">
                    <span>${emailShort}</span>
                    ${roleBadge}
                    <button class="logout-btn" onclick="logout()">Выйти</button>
                </div>
            `;
            adminTab.classList.toggle('visible', currentUser.role === 'admin');
        } else {
            authArea.innerHTML = '<button class="auth-btn" onclick="openModal()">Войти</button>';
            adminTab.classList.remove('visible');
        }
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('authBtn');
        const message = document.getElementById('modalMessage');
        btn.disabled = true;
        btn.textContent = 'Загрузка...';
        message.style.display = 'none';
        const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
        const url = `${API_URL}${endpoint}?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;
        try {
            const response = await fetch(url, { method: 'POST', credentials: 'include' });
            const data = await response.json();
            console.log('🔍 Ответ авторизации:', data);
            
            if (response.ok) {
                if (isLoginMode) {
                    message.textContent = 'Вход выполнен!';
                    message.className = 'message success';
                    message.style.display = 'block';
                    setTimeout(async () => { 
                        closeModal(); 
                        await checkAuth(); 
                    }, 800);
                } else {
                    message.textContent = 'Регистрация успешна! Войдите.';
                    message.className = 'message success';
                    message.style.display = 'block';
                    setTimeout(() => {
                        isLoginMode = true;
                        updateModal();
                        document.getElementById('email').value = email;
                        document.getElementById('password').value = '';
                    }, 1200);
                }
            } else {
                message.textContent = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
                message.className = 'message error';
                message.style.display = 'block';
            }
        } catch (error) {
            message.textContent = 'Ошибка соединения';
            message.className = 'message error';
            message.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        }
    });

    async function logout() {
        try { await fetch(`${API_URL}/auth/logout`, { method: 'POST', credentials: 'include' }); } catch(e) {}
        document.cookie.split(";").forEach(c => {
            document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
        });
        currentUser = { id: null, email: '', role: '', isLoggedIn: false };
        updateHeader();
    }

    document.getElementById('pizzaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('pizzaBtn');
        const message = document.getElementById('pizzaMessage');
        const pizzaId = document.getElementById('pizzaId').value;
        const pizzaData = {
            namePizza: document.getElementById('namePizza').value,
            cost: parseInt(document.getElementById('cost').value),
            ingredients: document.getElementById('ingredients').value,
            picturePizza: document.getElementById('picturePizza').value || '',
            size: parseInt(document.getElementById('size').value),
            thicknessDough: document.getElementById('thicknessDough').value === 'true'
        };
        btn.disabled = true;
        btn.textContent = isEditMode ? 'Сохранение...' : 'Добавление...';
        message.style.display = 'none';
        try {
            const url = isEditMode ? `${API_URL}/pizzas/update/${pizzaId}` : `${API_URL}/pizzas/add_pizza`;
            const method = isEditMode ? 'PUT' : 'POST';
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(pizzaData)
            });
            const result = await response.json();
            if (response.ok) {
                message.textContent = isEditMode ? 'Обновлено!' : 'Добавлено!';
                message.className = 'form-message success';
                message.style.display = 'block';
                await loadPizzas();
                if (!isEditMode) e.target.reset();
                setTimeout(() => {
                    message.style.display = 'none';
                    if (!isEditMode) switchTab('catalog');
                }, 1000);
            } else {
                message.textContent = typeof result.detail === 'string' ? result.detail : JSON.stringify(result.detail);
                message.className = 'form-message error';
                message.style.display = 'block';
            }
        } catch (error) {
            message.textContent = 'Ошибка соединения';
            message.className = 'form-message error';
            message.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.textContent = isEditMode ? 'Сохранить' : 'Добавить';
        }
    });

    function openModal() {
        document.getElementById('authModal').classList.add('active');
        isLoginMode = true;
        updateModal();
    }
    function closeModal() {
        document.getElementById('authModal').classList.remove('active');
        document.getElementById('modalMessage').style.display = 'none';
    }
    function toggleMode() {
        isLoginMode = !isLoginMode;
        updateModal();
    }
    function updateModal() {
        document.getElementById('modalTitle').textContent = isLoginMode ? 'Вход' : 'Регистрация';
        document.getElementById('modalSub').textContent = isLoginMode ? 'Войдите в аккаунт' : 'Создайте аккаунт';
        document.getElementById('authBtn').textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
        document.getElementById('toggleText').textContent = isLoginMode ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
        document.getElementById('toggleLink').textContent = isLoginMode ? 'Зарегистрироваться' : 'Войти';
    }

    // Функции корзины
    function openCartModal(pizzaId) {
        if (!currentUser.isLoggedIn) {
            openModal();
            showNotification('Нужно авторизоваться', 'error');
            return;
        }
        
        if (!currentUser.email) {
            showNotification('Ошибка: не удалось получить email пользователя', 'error');
            console.error('❌ currentUser.id отсутствует:', currentUser);
            return;
        }
        
        const pizza = allPizzas.find(p => p.id === pizzaId);
        if (!pizza) return;
        
        currentCartPizza = pizza;
        cartQuantity = 1;
        
        document.getElementById('cartPizzaName').textContent = pizza.namePizza;
        document.getElementById('cartPizzaPrice').textContent = `${pizza.cost} ₽`;
        document.getElementById('quantityDisplay').textContent = cartQuantity;
        document.getElementById('cartMessage').style.display = 'none';
        
        document.getElementById('cartModal').classList.add('active');
    }

    function closeCartModal() {
        document.getElementById('cartModal').classList.remove('active');
        currentCartPizza = null;
        cartQuantity = 1;
    }

    function changeQuantity(delta) {
        cartQuantity = Math.max(1, cartQuantity + delta);
        document.getElementById('quantityDisplay').textContent = cartQuantity;
    }

    async function confirmAddToCart() {
        if (!currentCartPizza) {
            showNotification('Ошибка: пицца не выбрана', 'error');
            return;
        }
        
        if (!currentUser.id) {
            showNotification('Ошибка: ID пользователя не найден', 'error');
            console.error('❌ currentUser:', currentUser);
            return;
        }
        
        const message = document.getElementById('cartMessage');
        message.style.display = 'none';
        
        const requestData = {
            pizza_id: currentCartPizza.id,
            user_email: currentUser.id,
            pizza_value: cartQuantity
        };
        
        console.log('📤 Отправка в корзину:', requestData);
        
        try {
            const response = await fetch(`${API_URL}/basket/add_pizza_on_basket`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(requestData)
            });
            
            const result = await response.json();
            console.log('📥 Ответ корзины:', result);
            
            if (response.ok) {
                showNotification(`✅ Добавлено в корзину: ${currentCartPizza.namePizza} (${cartQuantity} шт.)`);
                closeCartModal();
            } else {
                const errorMsg = typeof result.detail === 'string' ? result.detail : JSON.stringify(result.detail);
                message.textContent = errorMsg || 'Ошибка добавления';
                message.className = 'form-message error';
                message.style.display = 'block';
            }
        } catch (error) {
            console.error('💥 Ошибка добавления в корзину:', error);
            message.textContent = 'Ошибка соединения';
            message.className = 'form-message error';
            message.style.display = 'block';
        }
    }

    function showNotification(text, type = 'success') {
        const notification = document.getElementById('notification');
        notification.textContent = text;
        notification.className = `notification ${type}`;
        notification.style.display = 'block';
        setTimeout(() => {
            notification.style.display = 'none';
        }, 3000);
    }

    document.addEventListener('DOMContentLoaded', () => { loadPizzas(); checkAuth(); });
    document.getElementById('authModal').addEventListener('click', (e) => { if (e.target.id === 'authModal') closeModal(); });
    document.getElementById('cartModal').addEventListener('click', (e) => { if (e.target.id === 'cartModal') closeCartModal(); });
</script>

</body>
</html>
