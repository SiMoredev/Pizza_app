<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.3);
        }
        h2 { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; color: #0f172a; }
        .sub { color: #475569; margin-bottom: 1.8rem; font-size: 0.9rem; }
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.4rem; color: #1e293b; }
        input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-family: inherit;
            background: #f8fafc;
        }
        input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        button {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.75rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover { background: #2563eb; }
        .message {
            margin-top: 1rem;
            padding: 0.7rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
        .message.error { background: #fee2e2; color: #b91c1c; display: block; }
        .message.success { background: #dcfce7; color: #166534; display: block; }
        .toggle { text-align: center; margin-top: 1.2rem; font-size: 0.85rem; color: #475569; }
        .toggle a { color: #3b82f6; text-decoration: none; font-weight: 500; cursor: pointer; }
        hr { margin: 1.5rem 0 1rem; border: none; border-top: 1px solid #e2e8f0; }
        .api-hint { background: #f1f5f9; padding: 0.7rem; border-radius: 0.75rem; font-size: 0.7rem; color: #334155; margin-top: 1rem; text-align: center; }
        .logout-btn { background: #ef4444; margin-top: 0.5rem; }
        .logout-btn:hover { background: #dc2626; }
        .user-info { background: #e0f2fe; padding: 0.5rem; border-radius: 0.5rem; margin-top: 1rem; text-align: center; font-size: 0.8rem; word-break: break-all; }
        .cookie-status { background: #fef3c7; padding: 0.5rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.75rem; text-align: center; }
    </style>
</head>
<body>
<div class="card">
    <div id="cookieStatus" class="cookie-status" style="display: none;"></div>
    
    <h2 id="formTitle">Вход</h2>
    <div class="sub" id="formSub">Войдите в свой аккаунт</div>

    <form id="authForm">
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="password" required placeholder="••••••">
        </div>
        <button type="submit" id="actionBtn">Войти</button>
    </form>

    <div id="message" class="message"></div>

    <div class="toggle">
        <span id="toggleText">Нет аккаунта?</span>
        <a id="toggleLink">Зарегистрироваться</a>
    </div>
    
    <div id="logoutSection" style="display: none;">
        <div id="userInfo" class="user-info"></div>
        <hr>
        <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
    </div>
    
    <hr>
    <div class="api-hint">
        ⚙️ API: <strong id="apiEndpointDisplay">http://localhost:8000</strong><br>
        <span style="font-size: 0.65rem;">🍪 Cookie должны устанавливаться автоматически бэкендом</span>
    </div>
</div>

<script>
    const API_CONFIG = {
        baseUrl: 'http://localhost:8000',
        endpoints: {
            login: '/auth/login',
            register: '/auth/register'
        },
        cookieName: 'access_token'  // имя cookie, которое устанавливает бэкенд
    };

    let isLoginMode = true;
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const messageDiv = document.getElementById('message');
    const formTitle = document.getElementById('formTitle');
    const formSub = document.getElementById('formSub');
    const actionBtn = document.getElementById('actionBtn');
    const toggleLink = document.getElementById('toggleLink');
    const toggleText = document.getElementById('toggleText');
    const logoutSection = document.getElementById('logoutSection');
    const logoutBtn = document.getElementById('logoutBtn');
    const userInfoDiv = document.getElementById('userInfo');
    const cookieStatus = document.getElementById('cookieStatus');

    function showMessage(text, type = 'error') {
        messageDiv.textContent = text;
        messageDiv.className = 'message ' + type;
        setTimeout(() => {
            if (messageDiv.textContent === text) {
                messageDiv.style.display = 'none';
                messageDiv.className = 'message';
            }
        }, 4000);
        messageDiv.style.display = 'block';
    }

    // Получить все cookie
    function getAllCookies() {
        return document.cookie;
    }

    // Проверить наличие cookie от бэкенда
    function hasAuthCookie() {
        const cookies = document.cookie;
        // Проверяем наличие cookie с токеном (может называться access_token, token, или другое)
        return cookies.includes(API_CONFIG.cookieName) || 
               cookies.includes('access_token') || 
               cookies.includes('token');
    }

    // Обновление UI в зависимости от наличия cookie
    function updateAuthUI() {
        const hasCookie = hasAuthCookie();
        
        // Показываем статус cookie для отладки
        if (document.cookie) {
            cookieStatus.style.display = 'block';
            cookieStatus.innerHTML = `🍪 Найдены cookie: <strong>${document.cookie.split('; ').join('; ')}</strong>`;
        } else {
            cookieStatus.style.display = 'none';
        }
        
        if (hasCookie) {
            // Пользователь авторизован (есть cookie от бэкенда)
            document.getElementById('authForm').style.display = 'none';
            toggleLink.style.display = 'none';
            toggleText.style.display = 'none';
            logoutSection.style.display = 'block';
            
            // Пытаемся извлечь email из cookie или показываем общее сообщение
            userInfoDiv.innerHTML = `🔐 Авторизован (cookie установлены бэкендом)<br>
                                     <span style="font-size: 0.7rem;">${document.cookie}</span>`;
            formTitle.textContent = '✅ Добро пожаловать!';
            formSub.textContent = 'Вы успешно авторизованы';
        } else {
            document.getElementById('authForm').style.display = 'block';
            toggleLink.style.display = 'inline';
            toggleText.style.display = 'inline';
            logoutSection.style.display = 'none';
            
            if (isLoginMode) {
                formTitle.textContent = 'Вход';
                formSub.textContent = 'Войдите в свой аккаунт';
            } else {
                formTitle.textContent = 'Регистрация';
                formSub.textContent = 'Создайте новый аккаунт';
            }
        }
    }

    async function handleSubmit(e) {
        e.preventDefault();
        messageDiv.style.display = 'none';
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        if (!email || !password) {
            showMessage('Заполните email и пароль', 'error');
            return;
        }
        
        const btn = actionBtn;
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Загрузка...';
        
        try {
            const endpoint = isLoginMode ? API_CONFIG.endpoints.login : API_CONFIG.endpoints.register;
            const url = `${API_CONFIG.baseUrl}${endpoint}?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;
            
            // ВАЖНО: credentials: 'include' для получения cookie от бэкенда
            const response = await fetch(url, { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                credentials: 'include'  // <--- КЛЮЧЕВОЙ ПАРАМЕТР!
            });
            
            // После запроса проверяем, появились ли cookie
            console.log('Cookie после запроса:', document.cookie);
            
            let data = null;
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                data = await response.json();
            } else {
                const text = await response.text();
                data = { message: text || 'Ответ сервера' };
            }
            
            if (response.ok) {
                showMessage(`${isLoginMode ? 'Вход выполнен' : 'Регистрация успешна'}! Cookie должны быть установлены.`, 'success');
                
                // Обновляем UI после успешного запроса
                setTimeout(() => {
                    updateAuthUI();
                }, 100);
                
                emailInput.value = '';
                passwordInput.value = '';
                
                if (!isLoginMode) {
                    setTimeout(() => {
                        toggleMode();
                        showMessage('Аккаунт создан! Теперь войдите.', 'success');
                    }, 500);
                }
            } else {
                const errorMsg = data.message || data.detail || `Ошибка ${response.status}`;
                showMessage(errorMsg, 'error');
            }
        } catch (err) {
            console.error('Ошибка:', err);
            showMessage('Ошибка соединения с сервером. Проверьте URL и CORS.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = originalText;
        }
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            formTitle.textContent = 'Вход';
            formSub.textContent = 'Войдите в свой аккаунт';
            actionBtn.textContent = 'Войти';
            toggleText.textContent = 'Нет аккаунта?';
            toggleLink.textContent = 'Зарегистрироваться';
        } else {
            formTitle.textContent = 'Регистрация';
            formSub.textContent = 'Создайте новый аккаунт';
            actionBtn.textContent = 'Зарегистрироваться';
            toggleText.textContent = 'Уже есть аккаунт?';
            toggleLink.textContent = 'Войти';
        }
        messageDiv.style.display = 'none';
        emailInput.value = '';
        passwordInput.value = '';
    }

    // Выход - удаляем cookie через бэкенд
    async function logout() {
        try {
            // Если есть эндпоинт для выхода на бэкенде
            const logoutUrl = `${API_CONFIG.baseUrl}/auth/logout`;
            await fetch(logoutUrl, {
                method: 'POST',
                credentials: 'include'
            });
        } catch(e) {
            console.log('Бэкенд не имеет эндпоинта /logout');
        }
        
        // Также пробуем удалить cookie на фронте (если они не HttpOnly)
        document.cookie.split(";").forEach(function(c) {
            document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
        });
        
        updateAuthUI();
        showMessage('Вы вышли из системы', 'success');
    }

    // Периодическая проверка cookie (для отладки)
    setInterval(() => {
        if (hasAuthCookie() !== (logoutSection.style.display === 'block')) {
            updateAuthUI();
        }
    }, 1000);

    // Инициализация
    document.getElementById('authForm').addEventListener('submit', handleSubmit);
    toggleLink.addEventListener('click', (e) => {
        e.preventDefault();
        toggleMode();
        updateAuthUI();
    });
    logoutBtn.addEventListener('click', logout);

    document.getElementById('apiEndpointDisplay').textContent = API_CONFIG.baseUrl;
    
    // Проверяем авторизацию при загрузке
    updateAuthUI();
    
    console.log('🔍 Для отладки:');
    console.log('  - Проверьте вкладку Application → Cookies');
    console.log('  - Убедитесь что бэкенд настроен с CORS: allow_credentials=True, allow_origins=["http://127.0.0.1:5500"]');
</script>
</body>
</html>
